server:
  port: ${PORT:${BACKEND_PORT:8080}}
  forward-headers-strategy: framework

spring:
  application:
    name: cabinet-medical-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cabinet_medical}
    username: ${DATABASE_USERNAME:cabinet_user}
    password: ${DATABASE_PASSWORD:change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}
