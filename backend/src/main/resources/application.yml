server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: cabinet-medical-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cabinet_medical}
    username: ${DATABASE_USERNAME:cabinet_user}
    password: ${DATABASE_PASSWORD:change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-32-bytes-minimum}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
  bootstrap:
    cabinet-name: ${BOOTSTRAP_CABINET_NAME:}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}
